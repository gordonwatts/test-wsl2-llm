[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-wsl2-llm"
version = "0.1.0"
description = "Run reproducible Codex CLI tests in fresh WSL2 workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gordon Watts" }]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
  "typer>=0.15",
  "uproot>=5.0",
]

[project.scripts]
test-wsl2-llm = "test_wsl2_llm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/test_wsl2_llm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "wsl_acceptance: token-consuming tests that invoke real Codex in WSL2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
