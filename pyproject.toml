[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-wsl2-llm"
version = "0.1.0"
description = "Run reproducible coding-agent CLI tests in isolated workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gordon Watts" }]
keywords = ["coding-agents", "testing", "Codex", "WSL2"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "rich>=13.9",
  "tomli-w>=1.2",
  "typer>=0.15",
  "uproot>=5.0",
]

[project.urls]
Homepage = "https://github.com/gordonwatts/test-wsl2-llm"
Repository = "https://github.com/gordonwatts/test-wsl2-llm"
Issues = "https://github.com/gordonwatts/test-wsl2-llm/issues"

[project.scripts]
test-wsl2-llm = "test_wsl2_llm.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/test_wsl2_llm"]

[tool.hatch.build.targets.wheel.force-include]
"src/test_wsl2_llm/model-pricing.yaml" = "test_wsl2_llm/model-pricing.yaml"
"template.schema.json" = "test_wsl2_llm/template.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/test_wsl2_llm",
  "template.schema.json",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "RELEASING.md",
  "pyproject.toml",
  "scripts/verify_package.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "wsl_acceptance: token-consuming tests that invoke real Codex in WSL2",
  "ssh_integration: tests that exercise a disposable Linux OpenSSH server",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
